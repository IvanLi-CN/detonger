[package]
name = "detonger-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
detonger-protocol = { path = "../detonger-protocol" }
js-sys = "0.3.77"
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.100"
