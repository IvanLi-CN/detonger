[workspace]
resolver = "2"
members = [
  "crates/detonger-protocol",
  "crates/detonger-printer",
  "crates/detonger-cli",
  "crates/detonger-wasm",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
bluest = "0.6.9"
clap = { version = "4.5.32", features = ["derive"] }
futures = "0.3.31"
image = { version = "0.25.6", default-features = false, features = ["png"] }
objc2 = { version = "0.6.3", features = ["disable-encoding-assertions"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.14.0", features = ["serde"] }
